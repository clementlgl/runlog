repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Uses the frontend's own Prettier (and its Svelte / Tailwind plugins):
  # run `pnpm install` in frontend/ first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        files: ^frontend/
        types_or: [svelte, ts, javascript, css, json, html, markdown, yaml]
        entry: bash -c 'cd frontend && pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
