name: runlog

# Every setting below can be overridden in a .env file next to this one
# (see .env.example). Defaults match a local run on a workstation.

services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      # Region of the Xiaomi account, forced on login (Xiaomi sometimes answers
      # "cn" for a European account, which then reads no data). France: de.
      MIFIT_REGION: ${MIFIT_REGION:-de}
    volumes:
      - ${RUNLOG_DATA_DIR:-./data}:/data
      # mifit session (needed by sync). Read-write: mifit renews it.
      - ${MIFIT_SESSION_DIR:-${HOME}/.mifit}:/home/app/.mifit
    ports:
      # API + /docs. Keep it on 127.0.0.1: the frontend reaches it on the internal network.
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      # Public URL of the app, as typed in the browser (scheme + host + port).
      # Must match exactly, or SvelteKit rejects POSTs (sync) as cross-site.
      ORIGIN: ${RUNLOG_ORIGIN:-http://localhost:${RUNLOG_PORT:-3000}}
    ports:
      - "${RUNLOG_BIND:-127.0.0.1}:${RUNLOG_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
