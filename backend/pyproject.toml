[project]
name = "runlog-backend"
version = "0.1.0"
description = "API FastAPI + DuckDB pour analyser les courses Mi Fitness"
authors = [
    {name = "Clément Laigle",email = "c.laigle@catie.fr"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "mifit (>=0.4.0,<0.5.0)",
    "fastapi (>=0.162.5,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "duckdb (>=2.0.0,<3.0.0)",
    "polars (>=2.1.0,<3.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=9.2.0,<10.0.0)"
]
